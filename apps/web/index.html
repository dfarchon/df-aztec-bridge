<!doctype html>
<html lang="en" data-booting>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DF Aztec Bridge</title>
    <link rel="icon" href="./dfaztec-logo.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="./dfaztec-logo.jpg" />
    <meta
      name="description"
      content="Bridge Fee Juice to Aztec. DFArchon-styled wallet flow with a 5% L1 protocol fee."
    />
    <meta name="theme-color" content="#000000" />
    <meta name="referrer" content="no-referrer" />
    <script src="./theme-boot.js"></script>
    <link rel="stylesheet" href="./fonts/fira-sans.css" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000000;
        color: #ede4e8;
        font-family: "Fira Sans", system-ui, sans-serif;
        cursor:
          url("./cursors/01_default.png") 2 2,
          default;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        transition: opacity 0.28s ease;
        cursor:
          url("./cursors/13_busy_02.png") 2 2,
          wait;
      }

      #boot-splash.boot-splash-leave {
        opacity: 0;
        pointer-events: none;
      }

      html[data-booting] [data-boot-connect-wallet],
      html[data-booting] [data-boot-wallet-step] {
        visibility: hidden;
      }

      .boot-splash-inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
        box-sizing: border-box;
        width: min(29rem, calc(100vw - 2rem));
        max-width: calc(100vw - 2rem);
        padding: 1rem 1.15rem;
        /* Match dark dapp panels (--surface / --line) before styles.css loads. */
        border: 1px solid #2b1f26;
        border-radius: 0;
        background: #181215;
        box-shadow: none;
        text-align: center;
      }

      .boot-splash-copy {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        width: 100%;
        max-width: 100%;
      }

      .boot-splash-copy.is-error {
        width: min(36rem, calc(100vw - 3rem));
      }

      .boot-spinner {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 0.5rem;
        color: #ffd2dd;
        font: 600 0.875rem/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: clamp(0.625rem, 2.6vw, 0.875rem);
        white-space: nowrap;
        text-shadow: 0 1px 3px #000;
      }

      .boot-progress-characters {
        flex: 1;
        min-width: 0;
        display: flex;
        justify-content: space-between;
      }

      @media (max-width: 480px) {
        .boot-spinner { font-size: clamp(0.45rem, 2vw, 0.7rem); }
      }

      .boot-splash-title {
        margin: 0;
        font: 600 1.375rem/1.25 "Fira Sans", system-ui, sans-serif;
        color: #ffffff;
        text-shadow: 0 0 14px #000, 0 1px 2px #000;
      }

      .boot-splash-hint,
      .boot-splash-note {
        margin: 0;
        flex: 0 0 auto;
        overflow-wrap: anywhere;
        font: 400 0.875rem/1.45 "Fira Sans", system-ui, sans-serif;
        color: #f4eef2;
        text-shadow: 0 0 12px #000, 0 1px 2px #000;
      }

      .boot-splash-note[hidden] {
        display: none;
      }

      .boot-splash-copy.is-error .boot-splash-hint {
        flex: 0 1 auto;
        white-space: normal;
        text-wrap: balance;
      }

      .boot-reload-btn {
        display: inline-flex;
        align-self: center;
        align-items: center;
        justify-content: center;
        margin: 0.65rem 0 0;
        padding: 0.55rem 1.25rem;
        border: 1px solid #f4f4f5;
        background: #f4f4f5;
        color: #000000;
        font: 600 0.875rem/1.2 "Fira Sans", system-ui, sans-serif;
        white-space: nowrap;
        cursor:
          url("./cursors/02_hover.png") 2 2,
          pointer;
      }

      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #ffffff;
        color: #000000;
      }

      html[data-theme="light"] #boot-splash {
        background: transparent;
        color: #000000;
      }

      html[data-theme="light"] .boot-splash-inner {
        background: rgba(225, 225, 230, 0.4);
        border-color: rgba(60, 60, 65, 0.22);
      }

      html[data-theme="light"] .boot-splash-title,
      html[data-theme="light"] .boot-splash-hint,
      html[data-theme="light"] .boot-splash-note {
        color: #000000;
        text-shadow: 0 0 14px #fff, 0 1px 2px #fff;
      }

      html[data-theme="light"] .boot-splash-hint,
      html[data-theme="light"] .boot-splash-note {
        color: #5c4f55;
      }

      html[data-theme="light"] .boot-spinner {
        color: #762c45;
        text-shadow: 0 1px 3px #fff;
      }

      html[data-theme="light"] .boot-reload-btn {
        border-color: #000000;
        background: #ffffff;
        color: #000000;
      }
    </style>
  </head>
  <body>
    <div id="boot-field"></div>
    <div id="boot-splash" aria-live="polite" aria-busy="true">
      <div class="boot-splash-inner">
        <div class="boot-spinner" role="progressbar" aria-label="Estimated loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="3"><span class="boot-progress-characters" aria-hidden="true"><span>[</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>]</span></span><span class="boot-progress-label" aria-hidden="true">~3%</span></div>
        <p class="boot-splash-title">DF Aztec Bridge</p>
        <div class="boot-splash-copy">
          <p class="boot-splash-hint">Loading app… first visit may take a moment.</p>
          <p class="boot-splash-note" hidden>(first visit can take minutes)</p>
          <button type="button" class="boot-reload-btn" id="boot-reload">Reload this page</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
