<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DF Aztec Bridge · df/archon</title>
    <meta
      name="description"
      content="Bridge Fee Juice to Aztec. DFArchon-styled wallet flow with a 5% L1 protocol fee."
    />
    <meta name="theme-color" content="#000000" />
    <meta name="referrer" content="no-referrer" />
    <!-- Fonts are local/system only — no Google Fonts (IP / locale leakage). -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: #f4f4f5;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        transition: opacity 0.28s ease;
      }

      #boot-splash.boot-splash-leave {
        opacity: 0;
        pointer-events: none;
      }

      .boot-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
      }

      .boot-spinner {
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        border: 2px solid #1a1a1c;
        border-top-color: #f4f4f5;
        animation: boot-spin 0.75s linear infinite;
      }

      .boot-splash-title {
        margin: 0;
        font: 500 1.15rem/1.2 "Avenir Next", "Segoe UI", system-ui, sans-serif;
        letter-spacing: -0.03em;
      }

      .boot-splash-hint {
        margin: 0;
        max-width: 18rem;
        font: 400 0.8rem/1.45 "IBM Plex Mono", ui-monospace, monospace;
        color: #6e6e73;
        letter-spacing: 0.04em;
      }

      .boot-reload-btn {
        padding: 0.55rem 1.25rem;
        border: 1px solid #f4f4f5;
        background: #f4f4f5;
        color: #000;
        font: 500 0.85rem "Avenir Next", "Segoe UI", system-ui, sans-serif;
        cursor: pointer;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-live="polite" aria-busy="true">
      <div class="boot-splash-inner">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p class="boot-splash-title">DF Aztec Bridge</p>
        <p class="boot-splash-hint">Loading app… first visit may take a moment.</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
