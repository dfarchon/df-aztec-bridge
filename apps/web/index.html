<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DF Aztec Bridge</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #121212;
        color: #e8e8e8;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #121212;
        transition: opacity 0.28s ease;
      }

      #boot-splash.boot-splash-leave {
        opacity: 0;
        pointer-events: none;
      }

      .boot-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
      }

      .boot-spinner {
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        border: 2px solid #2a2a2a;
        border-top-color: #3d5afe;
        animation: boot-spin 0.75s linear infinite;
      }

      .boot-splash-title {
        margin: 0;
        font: 600 1.05rem/1.3 system-ui, sans-serif;
        letter-spacing: 0.01em;
      }

      .boot-splash-hint {
        margin: 0;
        max-width: 18rem;
        font: 400 0.85rem/1.45 system-ui, sans-serif;
        color: #999;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-live="polite" aria-busy="true">
      <div class="boot-splash-inner">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p class="boot-splash-title">DF Aztec Bridge</p>
        <p class="boot-splash-hint">Loading app… first visit may take a moment.</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
