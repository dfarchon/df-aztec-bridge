<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DF Aztec Bridge</title>
    <link rel="icon" href="./dfaztec-logo.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="./dfaztec-logo.jpg" />
    <meta
      name="description"
      content="Bridge Fee Juice to Aztec. DFArchon-styled wallet flow with a 5% L1 protocol fee."
    />
    <meta name="theme-color" content="#000000" />
    <meta name="referrer" content="no-referrer" />
    <script src="./theme-boot.js"></script>
    <link rel="stylesheet" href="./fonts/fira-sans.css" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000000;
        color: #ede4e8;
        font-family: "Fira Sans", system-ui, sans-serif;
        cursor:
          url("./cursors/01_default.png") 2 2,
          default;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        transition: opacity 0.28s ease;
        cursor:
          url("./cursors/13_busy_02.png") 2 2,
          wait;
      }

      #boot-splash.boot-splash-leave {
        opacity: 0;
        pointer-events: none;
      }

      .boot-splash-inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        box-sizing: border-box;
        width: max-content;
        max-width: calc(100vw - 2rem);
        padding: 1.5rem;
        text-align: center;
      }

      .boot-splash-copy {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        width: max-content;
        max-width: 100%;
      }

      .boot-splash-copy.is-error {
        width: min(36rem, calc(100vw - 3rem));
      }

      .boot-spinner {
        width: 2rem;
        height: 2px;
        background: #ffb7c5;
        opacity: 0.85;
        animation: boot-pulse 2s ease-in-out infinite;
      }

      .boot-splash-title {
        margin: 0;
        font: 600 1.375rem/1.25 "Fira Sans", system-ui, sans-serif;
        color: #ffffff;
      }

      .boot-splash-hint,
      .boot-splash-note {
        margin: 0;
        flex: 0 0 auto;
        white-space: nowrap;
        font: 400 0.875rem/1.45 "Fira Sans", system-ui, sans-serif;
        color: #9a8a92;
      }

      .boot-splash-note[hidden] {
        display: none;
      }

      .boot-splash-copy.is-error .boot-splash-hint {
        flex: 0 1 auto;
        white-space: normal;
        text-wrap: balance;
      }

      .boot-reload-btn {
        display: inline-flex;
        align-self: center;
        align-items: center;
        justify-content: center;
        margin: 0.65rem 0 0;
        padding: 0.55rem 1.25rem;
        border: 1px solid #f4f4f5;
        background: #f4f4f5;
        color: #000000;
        font: 600 0.875rem/1.2 "Fira Sans", system-ui, sans-serif;
        white-space: nowrap;
        cursor:
          url("./cursors/02_hover.png") 2 2,
          pointer;
      }

      @keyframes boot-pulse {
        50% {
          opacity: 0.45;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation: none;
        }
      }

      html[data-theme="light"],
      html[data-theme="light"] body,
      html[data-theme="light"] #boot-splash {
        background: #ffffff;
        color: #000000;
      }

      html[data-theme="light"] .boot-splash-title {
        color: #000000;
      }

      html[data-theme="light"] .boot-splash-hint,
      html[data-theme="light"] .boot-splash-note {
        color: #5c4f55;
      }

      html[data-theme="light"] .boot-spinner {
        background: #e78398;
      }

      html[data-theme="light"] .boot-reload-btn {
        border-color: #000000;
        background: #ffffff;
        color: #000000;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-live="polite" aria-busy="true">
      <div class="boot-splash-inner">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p class="boot-splash-title">DF Aztec Bridge</p>
        <div class="boot-splash-copy">
          <p class="boot-splash-hint">Loading app… first visit may take a moment.</p>
          <p class="boot-splash-note" hidden>(first visit can take minutes)</p>
          <button type="button" class="boot-reload-btn" id="boot-reload">Reload this page</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
