packages:
  - "apps/*"
  - "packages/*"

# pnpm v12 config (was package.json#pnpm + all of .npmrc).
# confirmModulesPurge is pnpm 11 only; pnpm 12 rejects it.
registry: https://registry.npmjs.org/
saveExact: true
autoInstallPeers: true
preferFrozenLockfile: true
lockfile: true
shamefullyHoist: false
strictDepBuilds: true
strictStorePkgContentCheck: true
verifyDepsBeforeRun: error
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Last semver 6 release (2023, npm maintainer lukekarrys). No 6.x build has SLSA
# provenance; @babel/core still depends on it. Do not widen this list casually.
trustPolicyExclude:
  - semver@6.3.1
  # Official pino 9.14.0 from matteo.collina, npm registry signature, no SLSA attestation.
  # Already the locked version. 9.13.1 has provenance but pulls slow-redact@0.3.2, which does not.
  - pino@9.14.0
# Committed lockfile is the trusted base (CI / closed-source). Skip re-checking every
# entry against live registry provenance — older pins (semver@6, undici@5, …) false-positive
# as "trust downgrades" vs newer releases that adopted OIDC/provenance.
trustLockfile: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false
# Fail when running pnpm ≠ packageManager pin (Corepack).
pmOnFail: error
# Pin explicitly — verifyDepsBeforeRun fails if this flips vs node_modules state.
enableGlobalVirtualStore: false

# Force patched transitive versions (audit high+ cleared). Keep majors compatible with @aztec/*.
overrides:
  # @types/node@22 asks for undici-types ~6.21.0, which has no SLSA attestation.
  # 6.23.0 is the same package line, published by GitHub Actions with provenance.
  "@types/node>undici-types": "6.23.0"
  # 1.8.0 is paulmillr with a registry signature but no provenance. 1.8.1 is the same author with SLSA.
  "@walletconnect/relay-auth>@noble/curves": "1.8.1"
  # 1.7.0 is paulmillr with a registry signature only. 1.7.1 is the next patch with SLSA.
  "@walletconnect/relay-auth>@noble/hashes": "1.7.1"
  # pino 10 resolves slow-redact to 0.3.2 (matteo.collina, no provenance). 0.3.1 has SLSA.
  "pino@10>slow-redact": "0.3.1"
  hono: "4.12.34"
  "@hono/node-server": "2.1.0"
  # 5.33.1 is inside GHSA-3f7j-7jwc-fxfj (<5.33.16). Stay on 5.33.x.
  systeminformation: "5.33.19"
  # 5.0.9 is inside GHSA-qhr7-859c-m2p7 (<5.0.11) and GHSA-6j4f-fj2g-mc7p (<5.0.10).
  brace-expansion: "5.0.12"
  ws: "8.21.3"
  # 1.19.0 is inside the axios 1.20.0 advisory set (ReDoS, prototype pollution, redirect SSRF).
  axios: "1.20.0"
  # 1.16.0–1.16.1 are inside the follow-redirects header advisories. 1.16.2 is the patched release.
  follow-redirects: "1.16.2"
  # 6.28.1 is inside GHSA-xjj6-f33q-929c / GHSA-2m5v-pch6-74hx / GHSA-qrxm-fqhp-jwvm (<6.29.1).
  undici: "6.29.1"
  # GHSA-mrhx-c7xc-m3w5 (<4.6.6). abitype 1.2 peers accept Zod 4, so Zod 3 copies move up too.
  "zod@<4.6.6": "4.6.7"
  "@opentelemetry/propagator-jaeger": "2.10.0"
  "@opentelemetry/core": "2.10.0"
  uuid: "11.1.1"
  # Vite toolchain (dev/build). vite@6.4.5 is the direct pin (GHSA range was <=6.4.3).
  postcss: "8.5.23"
  nanoid: "3.3.18"
  browserslist: "4.29.5"
  source-map-js: "1.2.2"
  # qs GHSA-x5fp-wj9c-mxmx / GHSA-4mjr-xmp4-gh2g / GHSA-6pq8-jhm2-2vcw. Patched at 6.16.1.
  qs: "6.16.1"
  # fast-copy GHSA-jggr-w7fw-pc2j (<4.1.0). Stay on 4.x.
  fast-copy: "4.3.1"
  # glob GHSA-3g3m-2fjr-6pw4 (<=14.0.1). 14.0.4 pulls minimatch 11, which clears the nested advisory.
  glob: "14.0.4"
  # pbkdf2 GHSA-477h-4r7f-fvrx (<=3.1.6) via vite-plugin-node-polyfills → crypto-browserify.
  pbkdf2: "3.1.7"

# Only these packages may run install/build lifecycle scripts.
allowBuilds:
  esbuild: true
  leveldown: true
  lmdb: true
  msgpackr-extract: true
  protobufjs: true
  "@reown/appkit": true

minimumReleaseAgeExclude:
  - ws@8.21.3
  - "@hono/node-server@2.1.0"
  - nanoid@3.3.18
  # Audit pins younger than minimumReleaseAge: glob 14.0.4 and the minimatch 11 it pulls.
  - "@isaacs/nonrecursive-glob-match@1.1.0"
  - glob@14.0.4
  - minimatch@11.0.5
