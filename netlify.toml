# Netlify — static web app (apps/web).
# Production: GitHub dfarchon/df-aztec-bridge (PRIVATE) → branch `main`.
#
# Env source of truth for ALL build contexts (production, deploy-preview, branch):
#   1) [build.environment] below (same values everywhere)
#   2) Optional UI overrides (Site → Environment variables) — must use VITE_* for web
# Template to paste into Netlify UI: `.env.netlify.example`
# Local `pnpm web`: use repo-root `.env` (from `.env.example`), then restart Vite.
#
# After changing VITE_*: Deploys → Trigger deploy → Clear cache and deploy site.

# Netlify does not read package.json#engines.node. NODE_VERSION below must match it
# (scripts/check-pnpm-hardening.sh enforces that). pnpm comes from package.json#packageManager via Corepack.
# Do not set NODE_VERSION or PNPM_VERSION in the Netlify UI; a UI value overrides this file.
[build]
  command = '''corepack enable && corepack prepare "$(node -p "require('./package.json').packageManager")" --activate && pnpm install --frozen-lockfile && pnpm --filter @df-bridge/browser-sdk build && pnpm --filter @df-bridge/web build'''
  publish = "apps/web/dist"

# Shared by production / deploy-preview / branch deploys / Netlify CLI builds.
[build.environment]
  NODE_VERSION = "24.22.1"
  VITE_ENABLE_BROWSER_CLAIM = "true"
  # Activity toasts stay hidden unless this is exactly "true".
  VITE_ENABLE_DAPP_LOG = "false"
  VITE_BRIDGE_FEE_RECIPIENT = "0x33D5928E1c66E831Eb250D1250bf2CfF9eACa370"
  VITE_BRIDGE_PUBLIC_URL = "https://aztec-dfarchon-kit.netlify.app/"
  VITE_DFPUNK_PLAY_URL = "https://aztec.dfpunk.xyz/play/"
  # Optional keyed RPC: set VITE_MAINNET_AZTEC_NODE_URL in Netlify UI (not git). Default is public aztec-mainnet.drpc.org.
  # Dev preview hosts: enable Netlify visitor password + VITE_DEV_GATE / VITE_DEV_GATE_PASSWORD_HASH in UI (never commit the hash of a real password into git).

# SPA fallback for client-side routing (only when the path is not a real file).
# Missing /a/sqlite3-opfs-async-proxy.js previously hit this and returned text/html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/a/sqlite3-opfs-async-proxy.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=0, must-revalidate"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/*.map"
  [headers.values]
    # Never serve source maps (defense if a map is ever emitted by mistake).
    Cache-Control = "no-store"
    Content-Type = "text/plain"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=(), interest-cohort=(), attribution-reporting=(), publickey-credentials-get=(self), publickey-credentials-create=(self)"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; connect-src 'self' data: blob: https://docs.aztec.network https://aztec.network https://aztecscan.xyz https://testnet.aztecscan.xyz https://devnet.aztecscan.xyz https://v5.testnet.rpc.aztec-labs.com https://crs.aztec-cdn.foundation https://crs.aztec-labs.com https://aztec-mainnet.drpc.org https://lb.drpc.live https://ethereum-rpc.publicnode.com https://ethereum-sepolia-rpc.publicnode.com https://etherscan.io https://sepolia.etherscan.io https://df-atlas.onchainreality.xyz https://aztec.dfpunk.xyz https://rpc.walletconnect.com https://rpc.walletconnect.org https://explorer-api.walletconnect.com https://pulse.walletconnect.org https://api.web3modal.org https://api.web3modal.com https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org https://*.reown.com wss://*.reown.com; frame-src 'self' https://verify.walletconnect.com https://verify.walletconnect.org https://secure.walletconnect.com https://secure.walletconnect.org"
