# Netlify — static web app (apps/web).
# Production: GitHub Stx69/df-aztec-bridge (PRIVATE) → branch `main`.
#
# Env source of truth for ALL build contexts (production, deploy-preview, branch):
#   1) [build.environment] below (same values everywhere)
#   2) Optional UI overrides (Site → Environment variables) — must use VITE_* for web
# Template to paste into Netlify UI: `.env.netlify.example`
# Local `pnpm web`: use repo-root `.env` (from `.env.example`), then restart Vite.
#
# After changing VITE_*: Deploys → Trigger deploy → Clear cache and deploy site.

[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @df-bridge/browser-sdk build && pnpm --filter @df-bridge/web build"
  publish = "apps/web/dist"

# Shared by production / deploy-preview / branch deploys / Netlify CLI builds.
[build.environment]
  NODE_VERSION = "24.12.0"
  PNPM_VERSION = "11.20.0"
  VITE_ENABLE_BROWSER_CLAIM = "true"
  VITE_BRIDGE_FEE_RECIPIENT = "0x33D5928E1c66E831Eb250D1250bf2CfF9eACa370"
  VITE_BRIDGE_PUBLIC_URL = "https://aztec-dfarchon-kit.netlify.app/"
  VITE_DFPUNK_PLAY_URL = "https://aztec.dfpunk.xyz/play/"
  VITE_MAINNET_AZTEC_NODE_URL = "https://lb.drpc.live/aztec-mainnet/AnUkBxJDjUo3ksEkgPshPngqoSJzkNIR8YO-RoYgFhqK"

# Contexts inherit [build.environment]; only restate the build command.
[context.production]
  command = "pnpm install --frozen-lockfile && pnpm --filter @df-bridge/browser-sdk build && pnpm --filter @df-bridge/web build"

[context.deploy-preview]
  command = "pnpm install --frozen-lockfile && pnpm --filter @df-bridge/browser-sdk build && pnpm --filter @df-bridge/web build"

[context.branch-deploy]
  command = "pnpm install --frozen-lockfile && pnpm --filter @df-bridge/browser-sdk build && pnpm --filter @df-bridge/web build"

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=0, must-revalidate"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/*.map"
  [headers.values]
    # Never serve source maps (defense if a map is ever emitted by mistake).
    Cache-Control = "no-store"
    Content-Type = "text/plain"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=(), interest-cohort=(), attribution-reporting=(), publickey-credentials-get=(self), publickey-credentials-create=(self)"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' data: blob: https: wss:; child-src 'self' blob:; manifest-src 'self'"
